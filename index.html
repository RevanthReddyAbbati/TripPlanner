<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Itinera plans multi-stop trips: routes on a live map, day-by-day timings, transport choices and group budgets." />
    <meta name="theme-color" content="#2557d6" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Itinera · Plan the trip, track every rupee" />
    <meta property="og:description" content="Timed day-by-day itineraries with live maps, group budgets, expense splitting and an optional Gemini trip assistant." />
    <meta property="og:image" content="./media/hero-poster.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Itinera · Trip Planner</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('itinera-settings') || '{}');
        var theme = (t.state && t.state.theme) || 'system';
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
